name: 24/7 Autonomous GTA 6 & Techno Gamerz Cloud Clipper

on:
  schedule:
    # 4 times daily at peak Indian gaming hours (IST):
    # 04:30 UTC = 10:00 AM IST (Morning boost)
    # 08:30 UTC = 02:00 PM IST (Afternoon peak)
    # 12:30 UTC = 06:00 PM IST (Evening peak)
    # 16:30 UTC = 10:00 PM IST (Night prime time)
    - cron: '30 4,8,12,16 * * *'
  workflow_dispatch:
    inputs:
      custom_url:
        description: 'Optional: Specific Video or Stream URL to Clip'
        required: false
        default: ''

jobs:
  run-autonomous-clipper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js (for yt-dlp 1080p stream extraction)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg with Libass
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install yt-dlp requests python-dotenv

      - name: Run Autonomous Cloud Clipper Engine
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_URL: ${{ github.event.inputs.custom_url }}
        run: |
          python main.py

      - name: Commit Updated Clip History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Auto: Update clipped moments history [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Git push skipped"

      - name: Save Generated Shorts as Cloud Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gta6-shorts
          path: output/**/*.mp4
          retention-days: 7
