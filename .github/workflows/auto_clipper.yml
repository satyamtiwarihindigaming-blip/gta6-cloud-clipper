name: 24/7 Autonomous GTA 6 Cloud Clipper (ClipKaro & Deep Clip)

on:
  schedule:
    # Runs automatically every 10 minutes in the cloud for ultra-frequent posting
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      stream_url:
        description: 'Direct Stream or Video URL to Clip'
        required: false
        default: ''
      mode:
        description: 'Clipping Mode (deep / instant / auto)'
        required: false
        default: 'deep'

jobs:
  run-clipper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js (for 1080p HD Stream Extraction)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg (with libass)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ClipKaro Deep Clip Engine (Zero Blur 1080p HD)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TARGET_STREAMERS: ${{ secrets.TARGET_STREAMERS }}
          INPUT_STREAM_URL: ${{ github.event.inputs.stream_url }}
          MODE: ${{ github.event.inputs.mode }}
          CLIP_DURATION: "45"
        run: |
          if [ -n "$INPUT_STREAM_URL" ]; then
            echo "Running ClipKaro on Direct Stream URL: $INPUT_STREAM_URL"
            python deepclip_stream.py --url "$INPUT_STREAM_URL" --layout "vertical-blur"
          else
            echo "Running 24/7 autonomous Indian & global streamer clipping"
            python main.py
          fi

      - name: Save Generated Shorts as Cloud Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gta6-shorts
          path: output/**/*.mp4
          retention-days: 7
